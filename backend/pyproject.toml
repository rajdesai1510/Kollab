# pyproject.toml — Nexus Backend
# Full uv-managed project file.
# Dependencies are managed here — use `uv add <pkg>` to add new packages.
# Lock file: uv.lock (auto-generated, commit to git)
#
# Common commands:
#   uv sync                  — install all deps from lock file
#   uv add <pkg>             — add a new runtime dependency
#   uv add --dev <pkg>       — add a dev-only dependency
#   uv run uvicorn app.main:app --reload  — run inside the venv

# ─────────────────────────────────────────────────────────────
# Project Metadata
# ─────────────────────────────────────────────────────────────
[project]
name = "nexus-backend"
version = "0.1.0"
description = "Creator-brand matchmaking platform API — India micro-influencer market"
requires-python = ">=3.11"

dependencies = [
    # ── Core Framework ────────────────────────────────────────
    "fastapi==0.111.1",
    "uvicorn[standard]==0.30.1",
    "python-multipart==0.0.9",

    # ── Database — MongoDB (Beanie ODM + Motor async driver) ──
    "beanie==1.26.0",
    "motor==3.4.0",
    "pymongo==4.7.3",

    # ── Cache + Sessions — Redis ───────────────────────────────
    "redis==5.0.6",
    "hiredis==2.3.2",

    # ── Background Tasks — Celery ──────────────────────────────
    "celery[redis]==5.4.0",

    # ── Configuration ──────────────────────────────────────────
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "python-dotenv==1.0.1",

    # ── Authentication ─────────────────────────────────────────
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "authlib==1.3.1",

    # ── HTTP Client ────────────────────────────────────────────
    "httpx==0.27.0",

    # ── File Storage — Cloudflare R2 / S3 ─────────────────────
    "boto3==1.34.131",
    "botocore==1.34.131",

    # ── Encryption ─────────────────────────────────────────────
    "cryptography==42.0.8",

    # ── Email ──────────────────────────────────────────────────
    "resend==2.2.0",

    # ── Geolocation ────────────────────────────────────────────
    "geopy==2.4.1",

    # ── Logging ────────────────────────────────────────────────
    "loguru==0.7.2",

    # ── Error Tracking ─────────────────────────────────────────
    "sentry-sdk[fastapi]==2.6.0",
]

# ─────────────────────────────────────────────────────────────
# Optional Dependency Groups
# ─────────────────────────────────────────────────────────────
[dependency-groups]

# Dev tools — installed by: uv sync --group dev
dev = [
    # Testing
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    # Code Quality
    "ruff==0.4.10",
    "black==24.4.2",
    "mypy==1.10.0",
    # Pre-commit
    "pre-commit==3.7.1",
    # Hot-reload support
    "watchfiles>=0.22.0",
]

# ─────────────────────────────────────────────────────────────
# uv Project Settings
# ─────────────────────────────────────────────────────────────
[tool.uv]
# Always use the project venv (.venv/) — not system Python
managed = true

# Package indexes (use default PyPI)
# index-url = "https://pypi.org/simple"

# ─────────────────────────────────────────────────────────────
# Build System (required by uv for editable installs)
# ─────────────────────────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]


# ─────────────────────────────────────────────────────────────
# Ruff — Linter + Formatter
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
indent-width = 4

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
    "G",    # flake8-logging-format
    "PIE",  # flake8-pie
    "T20",  # flake8-print
]

ignore = [
    "E501",   # line-too-long — handled by formatter
    "B008",   # function call in default arg (FastAPI Depends)
    "N805",   # first arg of method not 'self' (pydantic validators)
    "G004",   # f-string in logging (loguru uses f-strings)
    "T201",   # print() allowed in scripts
]

fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true


# ─────────────────────────────────────────────────────────────
# Black — Formatter
# ─────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | \.mypy_cache
  | \.ruff_cache
)/
'''


# ─────────────────────────────────────────────────────────────
# Mypy — Static Type Checker
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", ".venv/", "scripts/"]

[[tool.mypy.overrides]]
module = ["beanie.*", "motor.*", "pymongo.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true


# ─────────────────────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-ra",
    "--no-header",
]
markers = [
    "unit: Fast unit tests with no external dependencies",
    "integration: Tests that require a running MongoDB / Redis",
    "slow: Tests that take more than 2 seconds",
]


# ─────────────────────────────────────────────────────────────
# Coverage
# ─────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = [
    "app/main.py",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/tests/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
show_missing = true
precision = 2
fail_under = 70
